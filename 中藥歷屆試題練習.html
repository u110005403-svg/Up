<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f7f4;--sf:#fff;--tx:#222;--mu:#6b6b66;--bd:#dcdcd4;--ac:#2f6f5e;--ok:#e3f3e8;--okb:#2e8b57;--ng:#fbe6e4;--ngb:#c0392b;--wn:#fff3d6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--sf:#222427;--tx:#eceae4;--mu:#9a9a94;--bd:#3a3c40;--ac:#5fb59d;--ok:#1c3a2a;--okb:#4cc287;--ng:#43211f;--ngb:#ef6f62;--wn:#47391a}}
:root[data-theme="dark"]{--bg:#17181a;--sf:#222427;--tx:#eceae4;--mu:#9a9a94;--bd:#3a3c40;--ac:#5fb59d;--ok:#1c3a2a;--okb:#4cc287;--ng:#43211f;--ngb:#ef6f62;--wn:#47391a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.w{max-width:720px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:19px;margin:6px 0 10px}

.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.o{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font-size:15px}
.o.ok{background:var(--ok);border-color:var(--okb)}.o.ng{background:var(--ng);border-color:var(--ngb)}
.ex{font-size:13.5px;color:var(--mu);margin-top:4px;padding-left:2px}
.o.ok .ex,.o.ng .ex{color:var(--tx)}
.meta{font-size:13px;color:var(--mu);margin-bottom:6px;display:flex;justify-content:space-between}

.bar{height:6px;background:var(--bd);border-radius:3px;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}

small{color:var(--mu)}
.tw{overflow-x:auto;margin-top:8px}table{border-collapse:collapse;min-width:620px;font-size:12.5px}th,td{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}th{background:var(--bg);white-space:nowrap}td:first-child{font-weight:600;white-space:nowrap}

</style></head><body><div class="w">
<h1>中藥歷屆試題練習</h1>
<div class="tabs"><button data-t="home">依年份</button><button data-t="wrong">錯題</button><button data-t="hot">重錯</button><button data-t="conf">易混淆</button><button data-t="topic">考點</button><button data-t="tools">工具</button></div>
<div id="app"></div></div>
<script>
// [年份, 題號, 題目, [選項], 答案索引, [各選項詳解]]
const Q=[
["113-2",1,"中藥萊菔子能減弱人參的補氣作用,此為七情中的哪一種配伍關係?",["相畏","相殺","相惡","相反"],2,["相畏:一藥的毒副作用被另一藥抑制。","相殺:一藥能減輕或消除另一藥的毒性。","正確。相惡:一藥能減弱另一藥的功效,萊菔子(破氣)削弱人參(補氣)。","相反:兩藥合用產生毒副作用(十八反、十九畏)。"]],
["113-2",2,"有關中藥成分 spinosin 之敘述,下列何者錯誤?",["為 O-glycosides","具鎮靜作用","具 flavone 架構","存在於 Jujubae Fructus"],0,["錯誤(為答案)。spinosin(棘苷)是 flavone 的 C-glycoside,不是 O-glycoside。","正確。酸棗仁類 spinosin 具鎮靜安神作用。","正確。母核為 flavone。","正確。棗屬植物(含大棗)可見此成分。"]],
["113-2",3,"中藥杜仲所含之 pinoresinol diglucoside 成分主要具有下列何種藥理作用?",["抗氧化","降血脂","降血壓","降血糖"],2,["非主要作用。","非主要作用。","正確。講義:杜仲 Lignan glycosides: Pinoresinol diglucoside(降血壓活性成分)。","非主要作用。"]],
["113-2",4,"中藥淫羊藿具強筋骨祛風濕作用,其藥效成分 icariin 屬於下列何種化學分類?",["terpenoids","flavonoids","alkaloids","lipids"],1,["萜類,不符。","正確。講義:淫羊藿 Flavonoids(類黃酮): Icariin。","生物鹼,不符。","脂質,不符。"]],
["113-2",5,"下列溫裏藥之成分中,何者不具揮發性?",["anethole","l-asarinin","β-caryophyllene","zingiberene"],1,["anethole(茴香腦)為茴香揮發油成分,具揮發性。","正確。l-asarinin 為木脂素,非揮發性成分。","β-caryophyllene 為倍半萜,揮發油成分。","zingiberene 為薑的揮發油成分。"]],
["113-2",6,"下列何者為中藥麻黃(Ephedrae Herba)之主要藥理作用?",["保護肝臟","降血壓","解熱及中樞興奮","促進傷口癒合"],2,["非其主要作用。","麻黃鹼反而使血壓上升。","正確。ephedrine 具發汗解熱、平喘及中樞興奮作用。","非其主要作用。"]],
["113-2",7,"半夏生用會有麻舌感,其刺激性成分為何?",["homogentisic acid","peiminine","raphanin","pinellin"],0,["正確。講義:半夏含刺激性物質 Homogentisic acid(尿黑酸),須以水漂炮製去除。","peiminine 為貝母生物鹼。","raphanin 為萊菔子成分。","pinellin 非主要麻舌成分。"]],
["113-2",8,"下列中藥,何者之澱粉含量最高?",["杜仲","厚朴","葛根","阿膠"],2,["講義:杜仲含 pinoresinol diglucoside、三萜、iridoids,不以澱粉為主。","講義:厚朴含 magnocurarine、lignans、揮發油 β-eudesmol。","正確。講義小試身手:葛根成分含 Isoflavones(Daidzin、Daidzein、Puerarin)及 Starch(澱粉)。","講義:阿膠成分為 Gelatin、Collagen,不是澱粉。"]],
["113-2",9,"下列何者為細柱五加根皮所含之 phenylpropanoid glycosides 成分?",["eleutheroside A","syringin(β)","eudesmol","atractylon"],1,["講義將 Eleutheroside A 與 Syringin β 並列於五加皮成分,但本題標準答案為 B;Eleutheroside A 一般認為是 daucosterol(甾醇苷)。","正確。syringin(即 eleutheroside B)為苯丙素苷。","eudesmol 為倍半萜。","atractylon 為蒼朮的倍半萜。"]],
["113-2",10,"關於 Leonuri Herba 的敘述,下列何者錯誤?",["基原植物科別為芸香科","藥用部位為開花期全草","具利尿作用","所含 leonurine 可促進子宮收縮"],0,["錯誤(為答案)。益母草為唇形科,非芸香科。","正確。夏季花開時採收全草。","正確。具利尿消腫作用。","正確。leonurine 興奮子宮,用於婦科。"]],
["113-2",11,"下列何種中藥成分之結構不含氮(N)原子?",["prunasin","ligustilide","stachydrine","hirudinoidine A"],1,["prunasin 為氰苷,含氮(腈基)。","正確。ligustilide 為苯酞類,僅含 C、H、O。","stachydrine 為生物鹼,含氮。","hirudinoidine A 為含氮化合物。"]],
["113-2",12,"下列何者為中藥槐花主要成分之一且具有抗凝血作用?",["botulin","sophoradiol","simiarenol","quercetin"],3,["botulin 為三萜,非抗凝血代表。","sophoradiol 為三萜,非抗凝血代表。","simiarenol 為三萜。","正確。講義:Quercetin 抗凝血,含五個酚性 OH 基;Rutin(=Vitamin P)強化微血管通透性。"]],
["113-2",13,"下列中藥與其使用部位之配對,何者錯誤?",["厚朴-樹皮","白朮-根莖","豬苓-果實","連翹-果實"],2,["正確。","正確。","錯誤(為答案)。講義:豬苓(多孔菌科)使用部位為菌核,不是果實。","正確。連翹為果實。"]],
["113-2",14,"具瀉火解毒,且藥效成分結構屬 isoflavonoids 類,為治喉痹咽痛要藥的中藥是?",["敗醬草","黃芩","射干","蘆根"],2,["講義:敗醬草功效為排膿破血,不是以異黃酮為主。","講義:黃芩含 baicalein、wogonin,屬 flavone 類,不是 isoflavonoids。","正確。射干含 tectoridin、irigenin 等異黃酮,瀉火解毒、利咽喉(講義未見,為補充)。","蘆根為清熱瀉火類藥材,不以異黃酮為主(補充)。"]],
["113-2",15,"下列何種中藥,其主成分化學結構不屬於黃酮類?",["Puerariae Radix","Citri Reticulatae Pericarpium","Gardeniae Fructus","Sophorae Flos et Flos Immaturus"],2,["葛根含 daidzein、puerarin,為異黃酮。","陳皮含 hesperidin,為黃酮類。","正確。講義:梔子含單萜類苷 Geniposide(iridoid),不是黃酮。","槐花含 rutin,為黃酮類。"]],
["113-2",17,"有關中藥蛇床子之敘述,下列何者錯誤?",["基原植物科別為繖形科","具抗陰道滴蟲作用","使用部位為種子","含 osthole"],2,["正確。Cnidium monnieri 為繖形科。","正確。具殺滴蟲、止癢作用。","錯誤(為答案)。蛇床子藥用部位為成熟果實(Cnidii Fructus)。","正確。osthole(蛇床子素)為香豆素。"]],
["113-1",19,"下列何者不是中藥當歸的主要成分?",["n-butyl benzoate","ligustilide","ferulic acid","butylidene phthalide"],0,["正確(為答案)。n-butyl benzoate 不是當歸的主要成分。","當歸主要成分之一,為苯酞類揮發油。","當歸含阿魏酸,具抗血小板凝集作用。","當歸含 butylidene phthalide,為苯酞類。"]],
["113-1",20,"下列何者為中藥知母之功用主治?",["溫病血痢","黃疸酒毒","傷寒煩熱","驚癇骨蒸"],2,["非知母主治。","非知母主治(黃疸酒毒不是知母功效)。","正確。講義:知母(百合科 根莖)功效清肺瀉火、潤腎滋陰、治傷寒煩熱。","驚癇非知母主治。"]],
["113-1",22,"屬於豆科植物並具補腎溫脾、固精縮尿之中藥為何?",["續斷","鎖陽","補骨脂","淫羊藿"],2,["續斷為川續斷科,補肝腎、續筋骨。","鎖陽為鎖陽科,非豆科。","正確。補骨脂為豆科,補腎溫脾、固精縮尿(講義補陽類小試身手答案 C)。","淫羊藿為小蘗科。"]],
["113-1",23,"下列何者為中藥沉香之使用部位?",["folium","lignum","radix","stigma"],1,["folium 為葉。","正確。沉香為含樹脂的木材(Lignum)。","radix 為根。","stigma 為柱頭(如番紅花)。"]],
["113-1",24,"下列有關中藥陳皮之敘述,何者錯誤?",["具燥濕化痰作用","為二陳湯組成中藥之一","主要作用成分為脂質","為芸香科植物"],2,["正確。理氣健脾、燥濕化痰。","正確。二陳湯含半夏、陳皮、茯苓、甘草。","錯誤(為答案)。主要成分為黃酮類(hesperidin)及揮發油,非脂質。","正確。橘為芸香科。"]],
["113-1",25,"下列有關中藥覆盆子之敘述,何者錯誤?",["基原植物科別為 Rosaceae","使用部位為果實","主成分為 hinesol","具固精縮尿作用"],2,["正確。覆盆子為薔薇科。","正確。藥用未成熟果實。","錯誤(為答案)。hinesol 為蒼朮的倍半萜,非覆盆子主成分。","正確。益腎固精縮尿。"]],
["113-1",27,"下列何者非屬於果實類中藥材?",["蒼耳子","車前子","枸杞子","訶子"],1,["蒼耳子為帶總苞的果實。","正確。車前子為種子。","枸杞子為果實。","講義:訶子為使君子科果實。"]],
["113-1",28,"下列何者為中藥車前子之正確基原植物?",["Plantago ovata","Plantago psyllium","Plantago lanceolata","Plantago asiatica"],3,["P. ovata 為印度車前(洋車前),非中藥車前子基原。","P. psyllium 為西方藥用車前。","P. lanceolata 為長葉車前。","正確。車前子基原為 P. asiatica 或 P. depressa。"]],
["113-1",30,"有關 l-tetrahydropalmatine 之敘述,下列何者錯誤?",["為中藥延胡索(Corydalis Rhizoma)之活性成分","具 isoquinoline 骨架","不具中樞作用","具有鎮痛作用"],2,["正確。為延胡索主要活性成分之一。","正確。屬原小蘗鹼型異喹啉生物鹼。","錯誤(為答案)。具中樞鎮靜及鎮痛作用。","正確。延胡索活血止痛。"]],
["113-1",31,"中藥夏枯草之使用部位為何?",["莖梗","葉部","根部","花序或果穗"],3,["非藥用部位。","非藥用部位。","非藥用部位。","正確。夏枯草用果穗。"]],
["113-1",33,"牡丹皮新鮮時含有 paeonolide,經酶水解後所產生之苷元為何?",["oxypaeoniflorin","paeoniflorin","paeonol","lactiflorin"],2,["oxypaeoniflorin 為芍藥苷類衍生物,非水解產物。","paeoniflorin 為單萜苷,非苷元。","正確。paeonolide 水解得 paeonol(丹皮酚)。","lactiflorin 為芍藥類成分,非產物。"]],
["112-2",34,"下列中藥,何者藥效為「補氣固表、治表虛自汗、解肌熱」?",["丹參","當歸","黃耆","茯苓"],2,["講義:丹參功效為祛瘀生新、排膿生肌(孕婦慎用、反藜蘆),屬活血藥。","當歸屬補血、活血類,不是補氣固表。","正確。講義:黃耆(豆科 根)功效為補氣固表、治表虛自汗、解肌熱、瘡癰聖藥;玉屏風散=黃耆+白朮+防風。","茯苓屬利水滲濕類,不是補氣固表。"]],
["112-2",40,"中藥桔梗含有下列何種多醣?",["amylopectin","chitin","inulin","pectin"],2,["amylopectin(支鏈澱粉)不是桔梗的特徵成分。","chitin(幾丁質)見於甲殼、真菌,非桔梗成分。","正確。講義:桔梗(桔梗科 根)含皂苷 platycodins 及 Inulin(菊醣)。","pectin 非講義所列桔梗成分。"]],
["112-2",41,"下列何者為中藥枇杷葉所含之配醣體?",["platycodin D","onjisaponin A","eriojaposide A","daucosterol"],2,["platycodin D 為桔梗皂苷(桔梗主成分),非枇杷葉。","onjisaponin A 為遠志的皂苷類成分,非枇杷葉。","正確。講義:枇杷葉(薔薇科 葉)含 Apocarotenoid:Eriojaposide A,及三萜酸 maslinic acid、ursolic acid;功效止咳化痰(熱痰)。","daucosterol(胡蘿蔔苷)為甾醇苷,非枇杷葉特徵成分。"]],
["112-2",42,"有關延胡索之敘述,下列何者錯誤?",["基原植物屬百合科","含 dehydrocorydaline 成分,具抗胃潰瘍作用","為安中散組成之一","孕婦忌服"],0,["錯誤(為答案)。講義:延胡索(Corydalis yanhusuo)為罌粟科 Papaveraceae,塊莖。","正確。講義:dehydrocorydaline 抑制胃酸分泌、抗胃潰瘍、抑制子宮收縮。","正確。講義補充:安中散組成之一。","正確。講義:孕婦忌用。"]],
["112-2",43,"中藥連翹所含之成分,下列何者不屬於 lignan glycoside?",["forsythin","forsythide","arctiin","matairesinoside"],1,["forsythin(=phillyrin)為連翹的木脂素苷。","正確(為答案)。講義:forsythide 列於連翹的 Monoterpenoids(單萜),不是木脂素苷。","arctiin 為木脂素苷(苷元 arctigenin)。","matairesinoside 為木脂素苷(苷元 matairesinol)。"]],
["112-2",45,"有關中藥與其所屬基原植物科名之配對,下列何者正確?",["葛根-Ranunculaceae","牡丹皮-Rosaceae","枇杷葉-Fabaceae","麥門冬-Liliaceae"],3,["葛根為豆科 Fabaceae,不是毛茛科。","牡丹皮為毛茛科 Ranunculaceae,不是薔薇科。","講義:枇杷葉為薔薇科 Rosaceae,不是豆科。","正確。麥門冬為百合科 Liliaceae。"]],
["112-2",48,"有關中藥槐花之敘述,下列何者錯誤?",["使用部位僅為盛開的花","quercetin 含有五個酚性 OH 基","rutin 結構中之醣基在 C-3 位置","為止血藥"],0,["錯誤(為答案)。講義:槐花藥用部位包括花及花蕾(槐米),不是僅限盛開的花。","正確。講義:Quercetin 抗凝血,含五個酚性 OH 基。","正確。講義:Rutin(=Vitamin P)強化微血管通透性,醣基在 C3。","正確。槐花屬止血藥,涼血止血。"]],
["112-2",35,"下列何種中藥含有 zeaxanthin 成分,常被應用於明目?",["車前子","石斛","枸杞子","夏枯草"],2,["車前子為車前科種子,講義未列 zeaxanthin。","講義:石斛為蘭科,含 dendrobine 生物鹼,不是 zeaxanthin 代表藥材。","正確。講義:枸杞子(茄科 果實)含 Zeaxanthin、Carotene、Betaine、Kukoamine A;功效潤肺清肝、滋腎、補虛癘、明目。","夏枯草用果穗,清肝明目,但不是以 zeaxanthin 為代表。"]],
["112-2",36,"下列何種補益類中藥之主要活性成分屬 phenylethanoid glycoside?",["女貞子","續斷","肉蓯蓉","淫羊藿"],2,["講義:女貞子含 Iridoid glycosides(ligustroside)及三萜 ursolic acid,不是 phenylethanoid。","講義:續斷含 Iridoid glycosides(sweroside、loganin)、三萜皂苷、生物鹼 cantleyine。","正確。講義題目:肉蓯蓉所含 echinacoside 屬 phenylethanoid(苯乙醇苷類)配醣體。","講義:淫羊藿主成分 icariin 為 flavonoid。"]],
["112-2",38,"有關中藥訶子之敘述,下列何者錯誤?",["使用部位為成熟種子","主成分為 tannin 類","亦含有 sennoside A","具澀腸止瀉作用"],0,["錯誤(為答案)。講義:訶子(使君子科)藥用部位是果實 Chebulae Fructus,不是種子。","正確。講義:Tannins(chebulinic acid、ellagic acid)。","正確。講義:含 Dianthrone glycoside: Sennoside A。","正確。講義:收澀(tannin)、澀腸止瀉,久瀉久痢。"]],
["112-2",39,"下列何者為中藥荊芥揮發油之單萜類主成分?",["l-perillaldehyde","l-menthol","d-menthone","d-limonene"],2,["l-perillaldehyde 為紫蘇的成分,不是荊芥。","l-menthol 為薄荷的主成分,不是荊芥。","正確。講義:荊芥(唇形科 全草)的 Monoterpenoids 為 d-Menthone(鎮痛)、l-Pulegone(抗發炎);其揮發性成分為倍半萜 caryophyllene。","d-limonene 為柑橘類(如陳皮)揮發油成分,非荊芥代表。"]],
["112-2",44,"下列中藥之性味,何者與其他三者不同?",["梔子","龍膽","黃連","五加皮"],3,["講義:梔子性味為苦、寒。","講義:龍膽性味為苦、寒,歸肝、膽、膀胱經。","黃連屬清熱燥濕藥,性味苦寒(與梔子、龍膽相同)。","正確(為答案)。講義:五加皮性味為辛、苦、溫,歸肝、腎經,與其他三者的苦寒不同。"]],
["113-2",16,"關於中藥龍膽的敘述,下列何者錯誤?",["使用部位為根莖","歸肝、膽經","具有舒解腸道痙攣功效","苦味成分為 matrine"],3,["正確。講義:龍膽藥用部位為根及根莖。","正確。講義:歸肝、膽、膀胱經。","正確。講義:龍膽解腸道痙攣、促進傷口癒合。","錯誤(為答案)。講義:matrine 是苦參(Sophorae Flavescentis Radix)的生物鹼;龍膽的苦味成分是 gentiopicroside(單萜類苷)及 gentianine。"]],
["113-1",32,"下列中藥與其拉丁生藥名之配對,何者正確?",["桔梗-Bupleuri Radix","甘草-Glycyrrhizae Radix","人參-Notoginseng Radix","黃芩-Scutellariae Radix"],3,["錯誤。講義解析:桔梗=Platycodonis Radix;Bupleuri Radix 是柴胡。","錯誤。講義解析:甘草正確生藥名為 Glycyrrhizae Radix et Rhizoma(根及根莖)。","錯誤。講義解析:人參=Ginseng Radix et Rhizoma;Notoginseng Radix 是三七。","正確。黃芩=Scutellariae Radix。"]],
["113-1",29,"中藥白朮具止瀉作用,其功效為何?",["補腎","溫中","燥濕","澀腸"],2,["講義:白朮功效為燥濕、補脾和中、安胎,沒有「補腎」。","溫中為溫裏藥的功效,不是白朮。","正確。講義:白朮(菊科 根莖)含倍半萜 atractylon,功效「燥濕、補脾和中、安胎」;燥濕健脾故能止瀉。","澀腸是訶子的功效(講義訶子:澀腸止瀉),不是白朮。"]],
["112-1",49,"下列何者為動物類中藥?",["龍膽","肉蓯蓉","鎖陽","阿膠"],3,["講義:龍膽為龍膽科植物的根及根莖。","肉蓯蓉為植物類補陽藥。","鎖陽為植物類補陽藥。","正確。阿膠為驢皮熬製的膠,講義小試身手列成分為 Gelatin、Collagen(動物蛋白)。"]],
["112-1",51,"中藥鉤藤(Uncariae Ramulus cum Uncis)之生物鹼 rhynchophylline 具下列何種骨架?",["imidazole","isoquinoline","indole","purine"],2,["imidazole 不是鉤藤鹼的骨架。","講義:isoquinoline 骨架見於延胡索(l-THP)、黃連及黃柏(berberine)。","正確。講義:鉤藤(茜草科 帶鉤莖枝)含 Indole alkaloid: Rhynchophylline,降血壓、抗心律不整。","purine 非鉤藤鹼骨架。"]],
["112-1",52,"Angelica dahurica 為下列何種中藥之植物基原?",["白芷","白芍","白朮","白及"],0,["正確。講義:白芷(Angelicae Dahuricae Radix)基原 Angelica dahurica,繖形科,含 furocoumarins。","白芍基原為 Paeonia lactiflora(毛茛科)。","講義:白朮基原為 Atractylodes macrocephala(菊科)。","講義:白及基原為 Bletilla striata(蘭科)。"]],
["112-1",53,"中藥荊芥炒黑可用於:",["治傷寒頭痛","破結解毒","治血證","助脾消化"],2,["傷寒頭痛為辛溫解表類用途,不是炒黑後的用途。","破結解毒不是荊芥炒黑後的功用。","正確。講義補充:荊芥炒黑後為黑荊芥、荊芥炭,功效止血(治血症)。","助脾消化不是荊芥炒黑的功用。"]],
["112-1",55,"下列何種中藥能潤肺化痰及潤腸通便,含有西黃耆膠黏素(Bassorin)?",["Pinelliae Rhizoma","Fritillariae Bulbus","Sterculiae Lychnophorae Semen","Armeniacae Semen"],2,["講義:半夏含 pinellin 蛋白、homogentisic acid,功效除濕化痰和胃止嘔。","講義:貝母含生物鹼 peimine、peiminine,功效潤燥化痰散結除熱。","正確。講義:胖大海(梧桐科 種子)含 Bassorin(西黃耆膠黏素),功效潤燥化痰、潤腸通便。","杏仁主成分為 amygdalin,不含 bassorin。"]],
["112-1",57,"下列中藥,何者屬於芳香化濕藥?",["薄荷","辛夷","白朮","蒼朮"],3,["講義:薄荷屬辛涼解表藥(宣散風熱)。","講義:辛夷屬辛溫解表藥(通鼻竅)。","講義:白朮屬補氣、燥濕健脾類,不屬芳香化濕藥。","正確。講義小試身手答案為 D 蒼朮。"]],
["112-1",58,"川芎與下列何種中藥之基原植物科別相同?",["人參","丁香","當歸","黃連"],2,["人參為五加科,川芎為繖形科,不同。","丁香為桃金孃科,不同。","正確。講義:川芎與當歸同為繖形科 Apiaceae,都含 phthalide 類成分、具補血活血功效。","講義:黃連為毛茛科 Ranunculaceae。"]],
["112-1",59,"下列何種花類中藥之基原為豆科植物?",["Sophorae Flos et Flos Immaturus","Lonicerae Japonicae Flos","Magnoliae Flos","Carthami Flos"],0,["正確。講義:槐花(Sophora japonica L.)為 Fabaceae 豆科。","講義:金銀花為忍冬科 Caprifoliaceae。","講義:辛夷為木蘭科 Magnoliaceae。","紅花為菊科,不是豆科。"]],
["112-1",60,"下列何種中藥之主成分為 baicalein?",["Carthami Flos","Cynomorii Herba","Scutellariae Radix","Polygalae Radix"],2,["紅花主成分為 safflower yellow、carthamin 等,不是 baicalein。","鎖陽為補陽藥,不含 baicalein。","正確。講義:黃芩(唇形科 根)含類黃酮 Baicalein、Wogonin,瀉肺火、清熱燥濕。","遠志主成分為皂苷類,不是 baicalein。"]],
["113-1",21,"中藥枸杞子(Lycii Fructus)所含生物鹼 kukoamine A 具有下列何種藥理作用?",["降血糖","降血壓","刺激排卵","預防化學性肝損傷"],1,["講義:降血糖是枸杞子整體的藥理作用,不是特別歸屬於 kukoamine A。","正確。講義:枸杞子含生物鹼 Betaine、Kukoamine A,其中 Kukoamine A 具有降血壓、消炎功效。","講義:刺激排卵是枸杞子整體的藥理作用,不是 kukoamine A 的作用。","講義未將預防化學性肝損傷歸於 kukoamine A。"]],
["113-1",26,"下列何者不是中藥葛根成分 Puerarin 之功效?",["抑制心搏過速","抑制血管新生","降血壓","降膽固醇"],1,["講義:Puerarin 阻斷 β 型腎上腺素受體,抑制心搏過速,屬其功效。","正確(為答案)。講義未列 puerarin 有抑制血管新生作用(講義中抑制血管新生是皂莢乙醇萍取物的作用)。","講義:Puerarin 降低血壓、眼內壓,屬其功效。","講義:Puerarin 降低膽固醇,屬其功效。"]],
["112-1",54,"中藥柴胡之效能分類為何?",["祛寒溫中","清熱瀉火","辛涼解表","祛風止痛"],2,["祛寒溫中為溫裏藥的功效(如附子、肉桂)。","清熱瀉火為清熱藥的功效(如知母、梔子)。","正確。講義:柴胡(繖形科 根)列在辛涼解表藥,功效發表和解、疏肝解鬱;含 Saikosaponins。","祛風止痛不是柴胡的效能分類。"]],
["112-2",46,"下列何種成分屬於 diterpene alkaloid?",["aconitine","berberine","arecoline","morphine"],0,["正確。講義:附子(毛茛科 旁生塊根)含 Diterpenoid alkaloid(雙酯類生物鹼): Aconitine(烏頭鹼),有毒,需炮製降低毒性。","講義:berberine 為 Isoquinoline alkaloid(黃連、黃柏)。","arecoline(檳榔鹼)為檳榔的吡啶類生物鹼,不是二萜類。","morphine(嗎啡)屬異喹啉類(罌粟),不是二萜類。"]],
["112-1",61,"中藥龍膽所含生物鹼 gentianine 具有下列何種藥理作用?",["保護肝臟","抗發炎","解腸道痙攣","促進傷口癒合"],1,["保護肝臟是龍膽整體的藥理作用,不是特別歸於 gentianine。","正確。講義:Gentianine→抗發炎、降血壓。","解腸道痙攣是龍膽整體的藥理作用,不是 gentianine 的作用。","促進傷口癒合是龍膽整體的藥理作用,不是 gentianine 的作用。"]],
["111-2",62,"有關中藥何首烏之敘述,下列何者錯誤?",["基原為蓼科植物 Polygonum multiflorum","以塊莖入藥","性微溫,味苦、甘、澀","主成分屬 anthraquinone 類,生用能潤腸通便"],1,["正確。講義:何首烏 Polygonum multiflorum Thunb.,蓼科。","錯誤(為答案)。講義:何首烏藥用部位為塊根(Polygoni Multiflori Radix),不是塊莖。","正確。講義:性微溫,味苦、甘、澀。","正確。講義:含 Anthraquinone(chrysophanol、emodin),生用潤腸通便。"]],
["111-2",63,"下列何種中藥其主成分含多醣類及 sibiricosides?",["大棗","麥門冬","知母","黃精"],3,["講義:大棗含糖類、zizybeoside、spinosin、三萜酸。","講義:麥門冬含 ophiopogonins(皂苷)及 ophiopogonones(黃酮)。","講義:知母含 timosaponin(固醇類皂苷)及 mangiferin。","正確。講義:黃精含 Steroidal saponins: Sibiricosides A、B,及黃精多醣。"]],
["111-2",64,"中藥知母之基原植物科別為何?",["Labiatae","Liliaceae","Orchidaceae","Apiaceae"],1,["Labiatae 為唇形科(如丹參、荊芥),不是知母。","正確。講義:知母 Anemarrhena asphodeloides,百合科 Liliaceae,藥用根莖。","Orchidaceae 為蘭科(石斛、天麻、白及)。","Apiaceae 為繖形科(當歸、川芎、白芷、柴胡)。"]],
["111-2",65,"下列中藥何者之生藥拉丁名為 Ophiopogonis Radix?",["麥門冬","木通","鎖陽","遠志"],0,["正確。麥門冬=Ophiopogonis Radix(百合科 塊根)。","木通=Akebiae Caulis。","講義:鎖陽=Cynomorii Herba。","講義:遠志=Polygalae Radix。"]],
["111-2",66,"下列何者屬於補陽類中藥且源自於真菌類?",["天麻","冬蟲夏草","肉蓯蓉","鎖陽"],1,["講義:天麻為蘭科植物塊莖,屬平肝息風藥。","正確。冬蟲夏草(Cordyceps)為真菌,屬補陽藥(講義小試身手答案 B)。","講義:肉蓯蓉為列當科植物肉質莖。","講義:鎖陽為鎖陽科植物肉質莖。"]],
["111-2",67,"中藥白芷之主成分不含下列何者?",["volatile oils","flavonoids","coumarins","furocoumarins"],1,["白芷含揮發油,所以這不是答案。","正確(為答案)。講義:白芷成分為 coumarins、furocoumarins 及揮發油,不含 flavonoids。","講義:含 coumarins。","講義:含 furocoumarins(抗發炎,抑制 COX-2)。"]],
["111-2",68,"下列解表中藥,何者藥用部位為「完全成長之未開放的花蕾」?",["Nepeta tenuifolia","Perilla frutescens","Magnolia biondii","Zingiber officinale"],2,["荊芥(講義寫 Schizonepeta tenuifolia)用全草、花穗。","Perilla frutescens 為紫蘇,用葉(紫蘇葉)。","正確。講義:辛夷 Magnoliae Flos 基原 Magnolia biondii,用未開放花蕾。","Zingiber officinale 為生薑,用根莖。"]],
["111-2",69,"下列何種中藥之基原植物屬於繖形科,其藥效為辛涼解表、和解表裡?",["麻黃","柴胡","葛根","升麻"],1,["麻黃為辛溫解表藥,非繖形科。","正確。講義:柴胡(繖形科 Apiaceae)列在辛涼解表藥,功效發表和解、疏肝解鬱。","講義:葛根為豆科 Fabaceae。","升麻不屬繖形科。"]],
["111-2",70,"下列中藥,何者之功用主治為「祛瘀生新,治崩帶癥瘕、目赤疝痛、風痹不遂」等?",["丹參","升麻","葛根","柴胡"],0,["正確。講義:丹參功效祛瘀生新(唇形科,含 tanshinones),孕婦慎用,反藜蘆。","升麻屬辛涼解表,功效不是祛瘀生新。","講義:葛根功效為發汗解熱、解肌發表。","講義:柴胡功效為發表和解、疏肝解鬱。"]],
["111-2",71,"活血祛瘀藥益母草(Leonuri Herba)所含生物鹼 stachydrine(結構如圖)屬於下列何類結構之衍生物?",["quinoline","pyrrolidine","pyridine-piperidine","purine"],1,["quinoline 為雙環含氮結構,題圖不是。","正確。題圖 stachydrine 為含 N 的五員環,屬 pyrrolidine 衍生物。","pyridine-piperidine 為六員環系統,題圖不是。","purine 為雙環嘌呤結構,題圖不是。"]],
["111-2",72,"有關中藥連翹之敘述,下列何者錯誤?",["基原植物為 Forsythia suspensa","使用部位為花蕾","具消腫排膿作用","含有 lignan、monoterpenoid、triterpenoid 及 flavonoid 等類成分"],1,["正確。講義:連翹 Forsythia suspensa(木犀科)。","錯誤(為答案)。講義:連翹使用部位為果實(Forsythiae Fructus);花蕾是金銀花。","正確。講義:功效散結瀉火、消腫排膿,瘡家聖藥。","正確。講義:含 lignans、monoterpenoids(forsythide)、triterpenes(ursolic acid)及 flavonoids(rutin)。"]],
["111-2",73,"中藥梔子活性成分 geniposide(結構如圖)屬於下列何類化合物?",["monoterpene glycoside","secoiridoid glycoside","sesquiterpene glycoside","diterpene glycoside"],0,["正確。講義:梔子含單萜類苷(iridoid): Geniposide、Gardenoside。","secoiridoid glycoside 是龍膽 gentiopicroside 的類型,不是梔子。","geniposide 不屬倍半萜。","geniposide 不屬二萜。"]],
["111-2",75,"下列補氣中藥,何者之活性成分屬於 cycloartane type triterpenoid(如圖)?",["人參","山藥","大棗","黃耆"],3,["人參的人參皂苷屬 dammarane 型,不是 cycloartane。","講義:山藥含 diosgenin、dioscin(固醇類皂苷)。","講義:大棗含三萜酸(oleanolic acid、ursolic acid)。","正確。講義:黃耆含 Cycloartane 三萜: Astragalosides。"]],
["111-1",76,"有關中藥地黃之敘述,下列何者正確?",["基原為玄參科植物,使用部位為新鮮或乾燥塊莖","主成分 catalpol 為 iridoid glycoside","新鮮地黃所含醣類以 rhamnose 含量最高","生用為滋陰養血,炮製後轉為清熱涼血"],1,["錯誤。講義:地黃雖為玄參科,但使用部位是根、根莖,不是塊莖。","正確。講義:地黃含 Iridoid glycosides: Catalpol(梓醇)。","錯誤。講義:鮮地黃含量較高的是水蘇糖 stachyose,不是 rhamnose。","錯誤。講義:生地黃清熱涼血,熟地黃滋陰補血,敘述顛倒。"]],
["111-1",77,"下列何者為中藥方劑當歸補血湯之組成藥物之一?",["人參","川芎","芍藥","黃耆"],3,["當歸補血湯不含人參。","川芎不在當歸補血湯。","芍藥不在當歸補血湯。","正確。講義:當歸補血湯=當歸+黃耆,功效補氣生血。"]],
["111-1",78,"中藥續斷(Dipsaci Radix)所含 cantleyine 具有下列何種藥理作用?",["刺激子宮收縮作用","放鬆平滑肌作用","免疫抑制作用","預防化學性肝損傷"],1,["講義:續斷生物鹼 cantleyine 是抑制子宮收縮,不是刺激。","正確。講義:生物鹼 cantleyine→抑制子宮收縮(鬆弛平滑肌)。","講義:免疫抑制作用是續斷多醣類的作用,不是 cantleyine。","講義未將預防化學性肝損傷歸於 cantleyine。"]],
["111-1",79,"有關淫羊藿之敘述,下列何者錯誤?",["基原植物之一為 Epimedium brevicornu","使用部位為全草","活性成分為 icariin","功用主治為補腎陽、堅筋骨"],1,["正確。講義:Epimedium brevicornum(小蘗科)。","錯誤(為答案)。講義:淫羊藿使用部位為地上部,不是全草。","正確。講義:Icariin(類黃酮)為主要活性成分。","正確。講義:補腎陽、強筋骨。"]],
["111-1",81,"有關中藥柴胡之敘述,下列何者錯誤?",["其基原屬於繖形科植物","屬於辛溫解表藥","為逍遙散之組成藥材之一","具保肝作用"],1,["正確。講義:柴胡為繖形科 Apiaceae。","錯誤(為答案)。講義把柴胡列在辛涼解表藥,不是辛溫。","正確。講義:逍遙散由柴胡、當歸、白芍、白朮、茯苓、甘草、生薑、薄荷組成。","正確。講義:Saikosaponins 保護肝臟、抗突變、抗癌。"]],
["111-1",82,"下列中藥,何者須以水漂炮製去除刺激性化合物尿黑酸(homogentisic acid)?",["乳香","半夏","細辛","銀杏"],1,["乳香為樹脂類活血藥,不含 homogentisic acid。","正確。講義:半夏含刺激性物質 Homogentisic acid(尿黑酸),須以水漂炮製去除。","講義:細辛地上部含馬兜鈴酸,有腎毒性,不是尿黑酸。","講義:白果(銀杏)外種皮有毒成分是 ginkgolic acid 等長鏈酚類,不是尿黑酸。"]],
["111-1",84,"下列何者之功用主治為「暖子宮、止諸血,治崩帶、調經」?",["金銀花","蒲公英","牛膝","艾葉"],3,["講義:金銀花散熱解毒。","講義:蒲公英清熱解毒、消腫通淋。","牛膝為活血祛瘀藥,不是此功效。","正確。講義:艾葉(菊科 葉)暖子宮、止諸血、治崩漏帶下、理氣血、逐寒濕。"]],
["111-1",85,"中藥敗醬草之功用主治為何?",["涼血破血","活血止血","排膿破血","祛風舒筋"],2,["不是敗醬草的功效描述。","不是敗醬草的功效描述。","正確。講義:敗醬草(敗醬科 全草)功效為排膿破血,為治腸癰瘡要藥。","祛風舒筋不是敗醬草的功效。"]],
["111-1",86,"有關中藥牡丹皮之敘述,下列何者錯誤?",["與芍藥同為毛茛科植物","又名洛陽花,以根皮入藥","主含 diterpenoid 苷 paeoniflorin","功用主治為破積血、通經脈"],2,["正確。講義:牡丹皮、白芍、赤芍皆為毛茛科 Ranunculaceae。","正確。講義:牡丹皮以根皮入藥,別名有丹皮、木芍藥等。","錯誤(為答案)。講義:paeoniflorin 屬 Monoterpenes(單萜苷),不是 diterpenoid。","正確。講義:牡丹皮破積血、通經脈,為散惡血、順血脈要藥。"]],
["111-1",88,"中藥龍膽具清熱燥濕及瀉肝定驚藥效,主成分龍膽苦苷(gentiopicrin)屬何類配醣體?",["單萜","倍半萜","雙萜","三萜"],0,["正確。講義:龍膽含單萜類苷 Secoiridoid glycosides: Gentiopicroside(Gentiopicrin)。","不是倍半萜。","不是雙萜(雙萜如附子的 aconitine 生物鹼類)。","不是三萜。"]],
["110-2",89,"中藥知母所含芒果苷(mangiferin,結構如題圖)之苷元具下列何種骨架?",["steroid","xanthone","anthraquinone","phenylethanoid"],1,["講義:知母的 timosaponin 才是 steroid 皂苷,mangiferin 不是。","正確。講義:Xanthone C-glycoside: Mangiferin(芒果苷,含 Xanthone 骨架)。","anthraquinone 是大黃、何首烏類成分骨架。","phenylethanoid 見於肉蓯蓉的 acteoside、echinacoside。"]],
["110-2",90,"中藥女貞子之基原植物所屬科別為何?",["Cornaceae","Rosaceae","Rhamnaceae","Oleaceae"],3,["Cornaceae 為山茱萸科。","講義:Rosaceae 為薔薇科(覆盆子、枇杷葉)。","講義:Rhamnaceae 為鼠李科(大棗、酸棗仁)。","正確。講義:女貞子(Ligustrum lucidum)為木犀科 Oleaceae。"]],
["110-2",91,"有關杜仲的敘述,下列何者錯誤?",["經炮製後之樹皮,其白絲相連更加明顯","含有 lignan、iridoid 及 triterpenoid 等類成分","具降血壓作用","pinoresinol diglucoside 為其活性成分"],0,["錯誤(為答案)。講義:杜仲炮炙要炒到斷絲(不是白絲相連)。","正確。講義:Lignan glycosides、三萜類 ursolic acid、Iridoid glycosides。","正確。講義:降血壓、降低心收縮力。","正確。講義:Pinoresinol diglucoside 為降血壓活性成分。"]],
["110-2",92,"藥理上具降血壓功效之補肝腎中藥為何?",["黃芩","女貞子","杜仲","鎖陽"],2,["黃芩屬清熱燥濕藥,不是補肝腎。","講義:女貞子含 ligustroside、ursolic acid,藥理為抗氧化、抗發炎、增強免疫。","正確。講義:杜仲補肝腎、強筋骨、安胎,藥理降血壓。","講義:鎖陽藥理未列降血壓,含 ursolic acid、β-sitosterol 等。"]],
["110-2",93,"有關中藥覆盆子之敘述,下列何者錯誤?",["基原植物科別為 Rosaceae","使用部位為種子","含有機酸","其功用為補肝益腎"],1,["正確。講義:覆盆子(Rubus chingii)為薔薇科。","錯誤(為答案)。講義:覆盆子使用部位為果實,不是種子。","正確。講義成分含 fupenzic acid、有機酸類。","正確。講義:補氣益腎、補肝明目、固精縮尿。"]],
["110-2",94,"有關中藥五味子之敘述,下列何者錯誤?",["北五味子植物基原為 Schisandra chinensis","五味為甘、酸、苦、辛及鹹","使用部位為成熟之果實","schizandrin 與 gomisin A 均為具 γ-lactone 之 lignan"],3,["正確。講義:五味子基原 Schisandra chinensis。","正確。五味子皮肉甘酸、核中辛苦,都有鹹味,故稱五味。","正確。講義:五味子使用部位為果實。","錯誤(為答案)。講義:schizandrin、gomisins 為木脂素(lignans),但不是 γ-lactone 結構。"]],
["110-2",95,"下列何種中藥之使用部位為果實且屬於辛溫解表藥?",["枸杞子","五味子","蒼耳子","菟絲子"],2,["講義:枸杞子為補陰藥。","講義:五味子為收澀藥。","正確。蒼耳子為果實,列在辛溫解表藥。","講義:菟絲子為補陽藥,使用種子。"]],
["110-2",96,"中藥川芎(Chuanxiong Rhizoma)所含生物鹼 ligustrazine,下列何者非其藥理作用?",["抗心律不整","降血壓","免疫抑制","抑制子宮平滑肌收縮"],2,["講義:Ligustrazine 抗心律不整。","講義:Ligustrazine 降血壓。","正確(為答案)。講義未列免疫抑制;免疫抑制是續斷多醣類的作用。","講義:Ligustrazine 抑制子宮平滑肌收縮。"]],
["110-2",98,"下列清熱燥濕中藥,何者主含 secoiridoid 配醣體成分?",["黃芩","黃連","苦參","龍膽"],3,["講義:黃芩含 baicalein、wogonin(類黃酮)。","講義:黃連含 berberine、coptisine(isoquinoline 生物鹼)。","講義:苦參含 matrine、oxymatrine(生物鹼)。","正確。講義:龍膽含 Secoiridoid glycosides: gentiopicroside。"]],
["110-2",99,"下列何者中藥成分屬於 steroid glycoside?",["geniposide","paeoniflorin","timosaponin A-III","syringin"],2,["講義:geniposide 為單萜(iridoid)苷。","講義:paeoniflorin 為單萜苷。","正確。講義:知母含 Steroid glycosides(固醇類皂苷): Timosaponin。","講義:syringin 為 phenylpropanoid glycoside。"]],
["110-1",100,"下列中藥,何者所含多醣之主要作用非「增強免疫力」?",["黃耆","澤瀉","車前子","黃精"],2,["講義:黃耆多醣增強免疫力。","講義:澤瀉多醣增強免疫力。","正確。講義:車前子種皮的多醣為 hydrocolloid,吸水膨脹,作用為潤滑、緩瀉,不是增強免疫。","講義:黃精多醣刺激淋巴系統、增強免疫。"]],
["110-1",101,"下列何者不是中藥鉤藤所含生物鹼 rhynchophylline 之主要藥理作用?",["降血壓","抗心律不整","抗發炎作用","安神作用"],2,["講義:Rhynchophylline 降血壓。","講義:Rhynchophylline 抗心律不整。","正確(為答案)。講義未列抗發炎作用。","講義:Rhynchophylline 安神、抗癲癇。"]],
["110-1",102,"下列何種中藥為祛風勝濕之要藥?",["防風","半夏","貝母","蒼朮"],0,["正確。講義:防風(繖形科 根)祛風勝濕,治頭暈目眩、脊痛項強;李時珍說「防者禦也」,自古用治諸風。","講義:半夏功效為除濕化痰、和胃止嘔。","講義:貝母功效為潤燥化痰、散結除熱。","講義:蒼朮功效為燥濕健脾、發汗、明目,屬芳香化濕藥。"]],
["110-1",103,"下列中藥,何者在方劑煎煤時,應後下、不宜久煎?",["柴胡","薄荷","覆盆子","黃連"],1,["柴胡無須後下的講義說明。","正確。講義:薄荷(唇形科 地上部)含 l-Menthol 揮發油,不宜久煎,應後下。","覆盆子為果實,無須後下的講義說明。","黃連無須後下的講義說明。"]],
["110-1",104,"下列何者為中藥枇杷葉之特有成分?",["scabioside A","akeboside Stb","eriojaposide A","jujuboside A"],2,["講義:scabiosides 是黃花敗醬草的成分。","akeboside 為木通類皂苷。","正確。講義:枇杷葉含 Apocarotenoid: Eriojaposide A。","講義:jujubosides 是酸棗仁的三萜皂苷。"]],
["110-1",105,"下列利水滲濕中藥,何者主要成分屬於倍半萜類(sesquiterpenoid)?",["茯苓","木通","白朮","澤瀉"],2,["講義:茯苓含多醣與 Lanostane 型三萜(pachymic acid)。","木通主要為三萜皂苷類。","正確。講義:白朮含 Sesquiterpenoid: Atractylon(蒼朮酮)。","澤瀉:蛙蛙整理列有 Alismol(guaiane 型倍半萜)與 Alisol(protostane 型三萜),此題標準答案為白朮。"]],
["110-1",106,"下列中藥,何者經現代藥理實驗證實具增加冠狀動脈血流量及抗血小板凝集作用?",["川芎","薑黃","半夏","蒲公英"],0,["正確。講義:川芎藥理為增加冠狀動脈血流、抑制血小板凝集。","薑黃講義未列此作用。","講義:半夏藥理為抑制胃酸分泌、止嘔、凝血。","講義:蒲公英含 chlorogenic acid,抗感染。"]],
["110-1",107,"中藥丹參之水溶性成分 magnesium lithospermate B(如圖),屬於下列何種類化合物?",["三萜類(triterpenoid)","類黃酮(flavonoid)","類苯基丙烷(phenylpropanoid)","皂苷(saponin)"],2,["講義:丹參的非水溶成分 Tanshinones 才是二萜醌類。","不是類黃酮。","正確。講義:丹參水溶性成分 Magnesium lithospermate B 屬 Phenylpropanoid oligomers。","不是皂苷。"]],
["110-1",108,"下列清熱解毒中藥,其 chlorogenic acid 含量最高者為:",["敗醬草","北板藍根","金銀花","連翹"],2,["講義:敗醬草成分為 scabiosides、villoside。","講義:板藍根成分為 indican、indirubin。","正確。講義:金銀花以 Chlorogenic acid(綠原酸)為代表成分之一,拑制脂質過氧化。","講義:連翹以 lignans、forsythiaside 等為主。"]],
["110-1",109,"下列何種中藥之基原為唇形科之 Scutellaria baicalensis?",["何首烏","黃芩","紅花","女貞子"],1,["講義:何首烏為蓼科 Polygonum multiflorum。","正確。講義:黃芩 Scutellaria baicalensis,唇形科 Lamiaceae。","紅花為菊科。","講義:女貞子為木犀科 Oleaceae。"]],
["110-1",110,"下列利水滲濕中藥,何者主要成分屬於倍半萜類(sesquiterpenoid)?",["茯苓","木通","白朮","澤瀉"],2,["講義:茯苓含多醣與 Lanostane 型三萜。","木通主要為三萜皂苷類。","正確。講義:白朮含 Sesquiterpenoid: Atractylon。","澤瀉:蛙蛙整理列有 Alismol(guaiane 型倍半萜)與 Alisol(protostane 型三萜),此題標準答案為白朮。"]],
["110-1",111,"下列中藥與其拉丁生藥名之配對,何者錯誤?",["天花粉-Trichosanthis Radix","地骨皮-Paeoniae Radicis Cortex","桑白皮-Mori Radicis Cortex","五加皮-Acanthopanacis Radicis Cortex"],1,["正確。講義:抬葦根(天花粉)=Trichosanthis Radix。","錯誤(為答案)。講義:地骨皮=Lycii Radicis Cortex;Paeoniae 是芍藥類。","正確。講義:桑白皮=Mori Radicis Cortex。","正確。講義:五加皮=Acanthopanacis Radicis Cortex。"]],
["110-1",112,"下列成分何者不屬於 iridoid glycoside?",["catalpol","villoside","acteoside","sweroside"],2,["講義:地黃含 Iridoid glycoside: Catalpol。","講義:白花敗醬草含 Iridoid glycoside: Villoside。","正確(為答案)。講義:Acteoside 屬 Phenylethanoid glycosides(如肉蓯蓉、玄參),不是 iridoid。","講義:續斷含 Iridoid glycosides: Sweroside、Loganin。"]],
["109-2",113,"下列何者不是 dendrobine 之主要活性?",["止痛","解熱","抗真菌","降血糖"],2,["講義:Dendrobine→止痛。","講義:Dendrobine→解熱。","正確(為答案)。講義未列 dendrobine 有抗真菌作用。","講義:Dendrobine→降血糖、降血壓。"]],
["109-2",114,"中藥續斷所含成分中,下列何者具有鬆弛平滑肌之作用?",["sweroside","loganin","hederagenin 3-O-glycosides","cantleyine"],3,["講義:sweroside 是 iridoid glycoside,不是鬆弛平滑肌成分。","講義:loganin 是 iridoid glycoside,不是鬆弛平滑肌成分。","講義:hederagenin 為三萜皂苷,不是鬆弛平滑肌成分。","正確。講義:生物鹼 cantleyine→抑制子宮收縮(鬆弛平滑肌)。"]],
["109-2",115,"下列何種中藥具寧心安神,且有斂汗作用?",["遠志","酸棗仁","茯神","細辛"],1,["講義:遠志功效強志益智、聰耳明目、利九窩、辛散鬱,無斂汗。","正確。講義:酸棗仁寧心安神,治心煩不眠,味酸、斂汗。","茯神為茯苓抱根子實部位,講義未列斂汗。","講義:細辛溫散風邪、利九窩,無斂汗。"]],
["109-2",116,"中藥辛夷主治鼻炎及鼻蓄膿,其基原植物科別為何?",["木蘭科","五加科","大戟科","樟科"],0,["正確。講義:辛夷(Magnolia biondii)為木蘭科 Magnoliaceae,通九窩、治鼻淕(鼻竇炎)。","講義:五加科如五加皮(Araliaceae)。","大戟科不是辛夷科別。","講義:樟科如肉桂(Lauraceae)。"]],
["109-2",118,"中藥延胡索(Corydalis Rhizoma)所含之 l-tetrahydropalmatine 具有下列何種藥理作用?",["促進傷口癒合","鎮痛鎮癇作用","免疫抑制作用","預防化學性肝損傷"],1,["講義未列。","正確。講義:l-Tetrahydropalmatine→中樞抑制、鎮痛、鎮癇。","講義未列。","講義未列。"]],
["109-2",120,"有關中藥連翹的敘述,下列何者錯誤?",["arctiin 屬 flavonoid 類成分","forsythin 與 phillyrin 為同構異名","為散結瀉火、消腫排膿藥","基原植物為木犀科之 Forsythia suspensa"],0,["錯誤(為答案)。講義:arctiin 屬木脂素苷(Glycosides/lignans),不是 flavonoid;連翹的 flavonoid 是 rutin。","正確。講義:Forsythin 與 Phillyrin 為同構異名。","正確。講義:散結瀉火、消腫排膿。","正確。講義:Forsythia suspensa,木犀科 Oleaceae。"]],
["109-2",121,"梔子之基原植物科別為何?",["Apocynaceae","Papaveraceae","Rosaceae","Rubiaceae"],3,["Apocynaceae 為夢桃科,不是梔子。","講義:Papaveraceae 為罌粟科(延胡索)。","講義:Rosaceae 為薔薇科(覆盆子、枇杷葉)。","正確。講義:梔子(Gardenia jasminoides)為茜草科 Rubiaceae。"]],
["109-2",122,"下列何種中藥之植物基原為唇形科,且其主成分為 baicalein?",["黃芩","夏枯草","薄荷","益母草"],0,["正確。講義:黃芩(唇形科)含類黃酮 Baicalein、Wogonin。","夏枯草雖屬唇形科,但主成分不是 baicalein。","講義:薄荷(唇形科)主成分為 l-Menthol。","益母草雖屬唇形科,但主成分不是 baicalein。"]],
["109-2",123,"下列中藥,何者具有 labdane type 二萜苷的成分?",["覆盆子","五味子","木通","茯苓"],0,["正確。講義:覆盆子含 Labdane 二萜類: Goshonoside(覆盆子苷)。","講義:五味子含 lignans(schizandrin、gomisins)。","木通主要為三萜皂苷類。","講義:茯苓含多醣與 Lanostane 型三萜。"]],
["109-1",125,"下列有關中藥地黃主成分梓醇(catalpol)之敘述,何者正確?",["屬於單萜類","在熟地黃含量較生地黃高","含鼠李糖基","其醣基位於第 5 位置"],0,["正確。講義:地黃含單萜類苷 Iridoid glycosides: Catalpol(梓醇)。","錯誤。講義未有此說法;熟地黃為經炮製,一般認為 catalpol 經炮製後減少(補充)。","錯誤。講義:catalpol 的醣基是 D-glucose,不是鼠李糖。","錯誤。講義:Catalpol 的 D-glucose 接在 C1,不是第 5 位。"]],
["109-1",126,"下列何種中藥含有玉米黃素(zeaxanthin)與胡蘿蔔素(carotene)?",["丹參","枸杞子","五味子","梔子"],1,["講義:丹參含 tanshinones、Mg lithospermate B。","正確。講義:枸杞子色素含 Zeaxanthin、Carotene。","講義:五味子含 lignans(schizandrin、gomisins)。","講義:梔子紅色色素為 crocin(講義寫 Corcin/Gardenin)。"]],
["109-1",127,"有關淫羊藿之敘述,下列何者錯誤?",["有效成分為 lignan 類","icariin 之 C-3 接有 O-rhamnosyl、C-7 接有 O-glucosyl","具有 phytoestrogen 作用","屬於補陽藥"],0,["錯誤(為答案)。講義:淫羊藿有效成分為 Flavonoids(類黃酮)Icariin,不是 lignan。","正確。講義:Icariin C3 接 O-rhamnosyl、C7 接 O-glucosyl。","正確。講義:Icariin 屬 Phytoestrogen(植物雌激素)。","正確。講義:淫羊藿列在補陽藥,補腎陽、強筋骨。"]],
["109-1",128,"中藥沙苑蒺藜成分紫雲英苷(astragalin,如圖)屬於下列何類化合物?",["anthraquinone glycoside","diterpenoid glycoside","steroid glycoside","flavonoid glycoside"],3,["anthraquinone glycoside 是大黃類成分,題圖不是。","diterpenoid glycoside 如覆盆子的 goshonoside,不是紫雲英苷。","steroid glycoside 如知母的 timosaponin,不是紫雲英苷。","正確。講義:沙苑蒺藜含 Flavonoid(類黃酮苷): Astragalin。"]],
["109-1",129,"有關中藥天麻之敘述,下列何者正確?",["基原屬於蕐麻科植物","基原植物為 Rehmannia glutinosa","其使用部位為果實","為平肝息風藥"],3,["錯誤。講義:天麻(Gastrodia elata)為蘭科 Orchidaceae。","錯誤。Rehmannia glutinosa 是地黃;天麻基原為 Gastrodia elata。","錯誤。講義:天麻使用部位為塊莖。","正確。講義:天麻、鈎藤、白殭蠶列在平肝息風藥;天麻含 gastrodin、鎮靜、抗痙攣、抗癫癇。"]],
["109-1",130,"下列中藥,何者功用為「通九窩,治鼻塞鼻淕」等?",["辛夷","丹參","艾葉","紫蘇葉"],0,["正確。講義:辛夷功效為通九窩,治鼻塞鼻淕(鼻竇炎)、目眩齒痛。","講義:丹參功效為祛瘀生新。","講義:艾葉功效為暖子宮、止諸血。","紫蘇葉為辛溫解表藥,非此主治。"]],
["109-1",131,"中藥茯苓之基原植物科別與其使用部位為何?",["Polygalaceae,根","Polygonaceae,塊根","Polypodiaceae,孢子","Polyporaceae,菌核"],3,["Polygalaceae 是遠志科,使用根(遠志)。","Polygonaceae 是蓼科,使用塊根(何首烏)。","Polypodiaceae 為水龍骨科蕨類,雖名字相近,但不是茯苓。","正確。講義:茯苓 Poria cocos,多孔菌科 Polyporaceae,使用部位為菌核。"]],
["109-1",133,"主含 iridoid glycoside 類成分之中藥為何?",["黃柏、五味子","續斷、山茱萸","苦參、女貞子","酸棗仁、杜仲"],1,["講義:黃柏含 berberine、obakunone;五味子含 lignans,都不是 iridoid。","正確。講義:續斷含 Iridoid glycosides(sweroside、loganin);山茱萸主含 iridoid glycoside morroniside(後者為補充)。","講義:苦參含 matrine 生物鹼,不是 iridoid;女貞子雖含 ligustroside,但苦參不符。","講義:酸棗仁主含三萜皂苷 jujubosides;杜仲雖含 iridoid,但酸棗仁不符。"]],
["109-1",134,"古人稱瘡家聖藥是指下列何種中藥?",["金銀花","紫草","連翹","蒲公英"],2,["講義:金銀花功效為散熱解毒,未稱瘡家聖藥。","講義:紫草功效為涼血、活血、通二便。","正確。講義:連翹功效「散結瀉火、消腫排膿、瘡家聖藥」。","講義:蒲公英功效為清熱解毒、消腫通淋。"]],
["108-2",136,"肉蓯蓉所含 echinacoside 屬於下列何類配醣體?",["iridoid","phenylethanoid","flavonoid","anthraquinone"],1,["講義:iridoid 如續斷的 sweroside、地黃的 catalpol。","正確。講義:肉蓯蓉含 Phenylethanoid glycosides: Acteoside、Echinacoside。","講義:flavonoid 如淫羊藿 icariin。","講義:anthraquinone 如何首烏 chrysophanol。"]],
["108-2",137,"淫羊藿之主藥效成分屬下列何類?",["polysaccharides","triterpenoids","alkaloids","flavonoids"],3,["講義:淫羊藿主成分不是多醣。","講義:淫羊藿主成分不是三萜。","講義:淫羊藿主成分不是生物鹼。","正確。講義:淫羊藿主成分為 Flavonoids(類黃酮): Icariin。"]],
["108-2",138,"下列何種中藥地上部含有馬兜鈴酸(aristolochic acid)?",["半夏","木通","細辛","辛夷"],2,["講義:半夏的刺激性物質是 homogentisic acid。","木通(Akebiae Caulis)不含馬兜鈴酸;含馬兜鈴酸者是關木通。","正確。講義:細辛(馬兜鈴科)地上部含 Aristolochic acid(馬兜鈴酸)、Aritolochine,有腎毒性。","講義:辛夷含 magnolin、揮發油,不含馬兜鈴酸。"]],
["108-2",139,"下列何種中藥常用於治療鼻塞、流濁涕?",["荊芥","辛夷","酸棗仁","赤芍"],1,["講義:荊芥散風透疹。","正確。講義:辛夷通九窩,治鼻塞鼻淕(鼻竇)、治鼻炎、鼻蓄膿、鼻塞、流濁涕。","講義:酸棗仁寧心安神。","講義:赤芍散惡血、瀉肝火。"]],
["108-2",140,"下列何者具有發汗解熱且臺灣有產?",["葛根","梔子","知母","地黃"],0,["正確。講義:葛根功效發汗解熱、解肌發表,講義補充「台灣有產(質量多)」。","講義:梔子清心肺熱、由小便出。","講義:知母清肺瀉火、潤腎滋陰。","講義:地黃生用清熱涼血、熟用滋陰補血。"]],
["108-2",141,"用以清熱化痰之浙貝母,其主成分 peimine 之結構屬於下列何種生物鹼?",["indole alkaloid","isoquinoline alkaloid","steroidal alkaloid","tropane alkaloid"],2,["講義:indole alkaloid 如鈎藤的 rhynchophylline、吳茱萸的 evodiamine。","講義:isoquinoline 如黃連 berberine、延胡索 l-THP。","正確。講義:浙貝母含 Steroidal Alkaloids: Peimine(Verticine)、Peiminine。","tropane alkaloid 為莨蔷類鹼,不是貝母。"]],
["108-2",143,"關於中藥紫草之敘述,下列何者錯誤?",["基原植物之一為 Lithospermum erythrorhizon","具解熱鎮痛及抗發炎作用,可治水火燙傷","基原之科別為 Boraginaceae 植物","shikonin 與 alkannin 在構造上屬 diastereomer"],3,["正確。講義:紫草基原含 Lithospermum erythrorhizon。","正確。講義:解熱、鎮痛、抗發炎,治療水火燙傷。","正確。講義:紫草為紫草科 Boraginaceae。","錯誤(為答案)。講義:Shikonin 與 Alkannin 是 Enantiomer(鏡像/對掌異構物),不是 diastereomer。"]],
["108-2",144,"下列哪種藥材始載於神農本草經,列為下品,具有祛寒溫中、回陽救逆之藥效?",["石斛","苦參","貝母","附子"],3,["講義:石斛功效為養胃生津、補虛勞,不是回陽救逆。","講義:苦參功效為瀉火燥濕、祛風逐水、殺蟲。","講義:貝母功效為潤燥化痰、散結除熱。","正確。講義:附子(Aconiti Tuber)功效祛寒溫中、回陽救逆,有毒需炮製。"]],
["108-1",145,"下列有關黃耆之敘述,何者錯誤?",["藥用部位為根部","為豆科植物","生藥名為 Astragali Radix","蒙古黃耆之學名為 Astragalus membranaceus (Fisch.) Bge."],3,["正確。講義:黃耆為根。","正確。講義:黃耆為 Fabaceae 豆科。","正確。講義:生藥名 Astragali Radix。","錯誤(為答案)。講義:蒙古黃耆的學名是 Astragalus membranaceus (Fisch.) Bunge var. mongholicus (Bunge) Hsiao;膜莢黃耆才是 Astragalus membranaceus (Fisch.) Bunge。"]],
["108-1",146,"下列何者為杜仲之降血壓成分?",["aucubin","ulmoside","pinoresinol diglucoside","ursolic acid"],2,["講義:aucubin 是 iridoid 苷,不是降血壓成分。","講義:ulmoside 是雙萄萄糖苷類 iridoid,不是降血壓成分。","正確。講義:Pinoresinol diglucoside 為杜仲降血壓活性成分。","講義:ursolic acid 為三萜類,不是降血壓成分。"]],
["108-1",148,"屬於使君子科並具斂肺澀腸、降火利咽而開音的藥物為:",["桔梗","覆盆子","五味子","訶子"],3,["講義:桔梗功效為止咳平喘、清利頭目咽喉。","講義:覆盆子功效為固精縮尿、補肝明目。","講義:五味子屬木蘭科,功效斂肺鎮咳、斂汗。","正確。講義:訶子(使君子科 果實)功效斂肺澀腸、降火利咽、開音、久瀉久痢。"]],
["108-1",149,"下列何者為中藥歸類為活血化瘀藥且含有 phthalide 類成分?",["荊芥","厚朴","川芎","白朮"],2,["講義:荊芥功效為散風透疹,屬解表藥。","講義:厚朴功效為益腸胃、燥濕、行氣,含 magnolol。","正確。講義:川芎含 Phthalides: Ligustilide,功效和血行氣、治一切血症。","講義:白朮含 atractylon,功效燥濕補脾。"]],
["108-1",151,"清熱解毒藥中,含 forsythiaside 成分者何者?",["敗醬草","北板藍根","金銀花","連翹"],3,["講義:敗醬草含 scabiosides、villoside。","講義:板藍根含 indican、indirubin。","講義:金銀花含 chlorogenic acid、loganin、lonicerin。","正確。講義:連翹含 Forsythiaside、Arctiin、Matairesinoside 等。"]],
["108-1",152,"含有靛苷(indican)成分的中藥為:",["Inulae Flos","Isatidis Radix","Imperatae Rhizoma","Ipomoeae Semen"],1,["旋覆花(Inulae Flos)不是 indican 的來源。","正確。講義:板藍根(Isatidis Radix,十字花科 根)含 Indican、Indirubin,Indirubin 用於治療 CML。","白茅根(Imperatae Rhizoma)不是 indican 的來源。","牽牛子(Ipomoeae Semen)不是 indican 的來源。"]],
["108-1",153,"下列哪一個中藥之使用部位為乾燥花序或果穗?",["夏枯草","梔子","敗醬草","蒺藜"],0,["正確。夏枯草使用部位為果穗(講義小試身手:夏枯草為花序或果穗)。","講義:梔子使用部位為果實。","講義:敗醬草使用部位為全草。","講義:蒺藜使用部位為果實。"]],
["108-1",154,"梔子為清熱瀉火的中藥,其主成分 geniposide 是屬於何種配醣體?",["單萜類","倍半萜類","雙萜類","三萜類"],0,["正確。講義:梔子含單萜類苷 Geniposide、Gardenoside。","geniposide 不屬倍半萜類。","geniposide 不屬雙萜類。","geniposide 不屬三萜類。"]],

function hot(){
 list=[];const h=Q.filter(q=>st(q.id).w>=2).sort((a,b)=>st(b.id).w-st(a.id).w);
 app.innerHTML='<div class="card"><b>🔥 錯兩次以上的題目</b><p><small>共 '+h.length+' 題,依錯誤次數排序。</small></p>'+(h.length?'<button class="btn p" id="hq">只測這些題</button> ':'')+'<button class="btn" id="rs">清除所有紀錄</button></div>'+(h.map(q=>{const s=st(q.id);return '<div class="card hot"><div class="meta"><span>'+q[0]+' 第'+q[1]+'題</span><span>錯 '+s.w+' 次</span></div><div class="q">'+q[2]+'</div><div>✔ ('+"ABCD"[q[4]]+') '+q[3][q[4]]+'</div><div class="ex">'+q[5][q[4]]+'</div>'+(s.note?'<div class="tag" style="display:block;margin-top:6px">我的錯因:'+esc(s.note)+'</div>':'')+'</div>'}).join("")||'<div class="card"><small>目前沒有錯兩次以上的題目。</small></div>');
 if(h.length)$("#hq").onclick=()=>start(h,"wrong");
 $("#rs").onclick=()=>{if(confirm("確定清除所有作答紀錄?")){S={};save();hot()}};
}
function chapQ(c){const ns=c[1].flatMap(h=>h[0].replace("★","").split("/"));return Q.filter(q=>ns.some(x=>q.t.includes(x)))}
function rate(l){let c=0,w=0;l.forEach(q=>{const s=S[q.id];if(s){c+=s.c;w+=s.w}});return c+w?Math.round(c/(c+w)*100)+'%('+c+'/'+(c+w)+')':'尚未作答'}
function tools(){
 list=[];const ys=[...new Set(Q.map(q=>q[0]))];
 let h='<div class="card"><b>模擬考</b><p><small>從全部題庫隨機抽 50 題並計時。</small></p><button class="btn p" id="ex">開始模擬考</button></div>';
 h+='<div class="card"><b>設定</b><p><label><input type="checkbox" id="s1"'+(SET.shq?' checked':'')+'> 題目順序隨機</label><br><label><input type="checkbox" id="s2"'+(SET.sho?' checked':'')+'> 選項順序隨機</label></p></div>';
 h+='<div class="card"><b>依章節練習</b><div class="yrs" style="margin-top:8px">'+G3.map((c,n)=>{const m=chapQ(c).length;return m?'<button class="btn cp" data-c="'+n+'">'+c[0]+'('+m+')</button>':''}).join("")+'</div></div>';
 h+='<div class="card"><b>搜尋</b><input id="sq" placeholder="輸入藥名、成分或關鍵字" style="width:100%;margin-top:6px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)"><div id="sr"></div></div>';
 h+='<div class="card"><b>學習統計(答對率)</b><div style="margin-top:6px"><b style="font-size:13px">各年份</b>'+ys.map(y=>'<div class="ex">'+y+':'+rate(Q.filter(q=>q[0]===y))+'</div>').join("")+'<b style="font-size:13px">各章節</b>'+G3.map(c=>'<div class="ex">'+c[0]+':'+rate(chapQ(c))+'</div>').join("")+'</div></div>';
 const fl=Q.filter(q=>st(q.id).flag);
 h+='<div class="card"><b>回報有誤的題目('+fl.length+')</b>'+fl.map(q=>'<div class="ex">'+q[0]+' 第'+q[1]+'題:'+esc(q[2]).slice(0,40)+'</div>').join("")+'<p><small>把這個清單告訴我,我會逐題核對修正。</small></p></div>';
 h+='<div class="card"><b>匯出 / 匯入作答紀錄</b><textarea id="bk" rows="4" style="width:100%;margin-top:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:12px"></textarea><div style="margin-top:6px"><button class="btn" id="be">產生備份</button> <button class="btn" id="bi">匯入</button></div><small id="bm"></small></div>';
 app.innerHTML=h;
 $("#ex").onclick=()=>start(Q.slice().sort(()=>Math.random()-.5).slice(0,50),"exam");
 $("#s1").onchange=e=>{SET.shq=e.target.checked;saveSet()};
 $("#s2").onchange=e=>{SET.sho=e.target.checked;saveSet()};
 app.querySelectorAll(".cp").forEach(b=>b.onclick=()=>start(chapQ(G3[+b.dataset.c]),"year"));
 $("#sq").oninput=e=>{const k=e.target.value.trim().toLowerCase();if(!k){$("#sr").innerHTML="";return}
  const r=Q.filter(q=>q.t.toLowerCase().includes(k));
  const hs=G3.flatMap(c=>c[1].filter(x=>(x[0]+x[1]+x[2]).toLowerCase().includes(k)).map(x=>x[0]+':'+x[2]));
  $("#sr").innerHTML='<p><small>題目 '+r.length+' 題;考點 '+hs.length+' 項</small></p>'+(r.length?'<button class="btn p" id="sp">練習這些題</button>':'')+hs.slice(0,8).map(t=>'<div class="ex">'+esc(t)+'</div>').join("");
  if(r.length)$("#sp").onclick=()=>start(r,"year")};
 $("#be").onclick=()=>{$("#bk").value=JSON.stringify({S:S,SET:SET});$("#bk").select();try{document.execCommand("copy");$("#bm").textContent="已產生並嘗試複製,請存到備忘錄。"}catch(e){$("#bm").textContent="請手動複製上方文字。"}};
 $("#bi").onclick=()=>{try{const o=JSON.parse($("#bk").value);if(o.S)Object.assign(S,o.S);if(o.SET)Object.assign(SET,o.SET);save();saveSet();$("#bm").textContent="已匯入。"}catch(e){$("#bm").textContent="格式不正確。"}};
}
let NOTES=[];try{NOTES=JSON.parse(localStorage.getItem("zy_notes")||"[]")}catch(e){}
function saveNotes(){try{localStorage.setItem("zy_notes",JSON.stringify(NOTES))}catch(e){}}
function favBtn(q){return '<button class="btn fv" data-id="'+q.id+'" style="padding:2px 10px;font-size:13px;margin-left:8px">'+(st(q.id).fav?'★ 已收藏':'☆ 收藏')+'</button>'}
const _quiz=quiz;
quiz=function(){_quiz();if(i<list.length){const m=app.querySelector('.meta');if(m&&m.firstElementChild)m.firstElementChild.insertAdjacentHTML('beforeend',favBtn(list[i]))}};
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".fv");if(!b)return;const s=st(b.dataset.id);s.fav=!s.fav;save();document.querySelectorAll('.fv[data-id="'+b.dataset.id+'"]').forEach(x=>x.textContent=s.fav?'★ 已收藏':'☆ 收藏')});
const _tools=tools;
tools=function(){_tools();
 const f=Q.filter(q=>st(q.id).fav);
 const c=document.createElement("div");c.className="card";
 c.innerHTML='<b>★ 收藏題目('+f.length+')</b>'+(f.length?'<p><button class="btn p" id="fp">練習收藏題</button></p>':'<p><small>在作答畫面按「☆ 收藏」就會加到這裡。</small></p>')+f.map(q=>'<div class="hb"><small>'+q[0]+' 第'+q[1]+'題</small><div class="pt">'+esc(q[2])+'</div><div class="ex">✔ ('+"ABCD"[q[4]]+') '+esc(q[3][q[4]])+'</div>'+favBtn(q)+'</div>').join("");
 app.insertBefore(c,app.firstChild);
 const fp=c.querySelector("#fp");if(fp)fp.onclick=()=>start(f,"year");
 $("#be").onclick=()=>{$("#bk").value=JSON.stringify({S:S,SET:SET,NOTES:NOTES});$("#bk").select();try{document.execCommand("copy");$("#bm").textContent="已產生並嘗試複製,請存到備忘錄。"}catch(e){$("#bm").textContent="請手動複製上方文字。"}};
 $("#bi").onclick=()=>{try{const o=JSON.parse($("#bk").value);if(o.S)Object.assign(S,o.S);if(o.SET)Object.assign(SET,o.SET);if(o.NOTES){const ids=new Set(NOTES.map(n=>n.i));o.NOTES.forEach(n=>{if(!ids.has(n.i))NOTES.push(n)});saveNotes()}save();saveSet();$("#bm").textContent="已匯入。"}catch(e){$("#bm").textContent="格式不正確。"}};
};
const _hot=hot;
hot=function(){_hot();const r=$("#rs");if(r)r.onclick=()=>{if(confirm("確定清除所有作答紀錄?(收藏與隨手寫不會被清除)")){const k={};Object.keys(S).forEach(id=>{if(S[id]&&S[id].fav)k[id]={w:0,c:0,pool:false,fav:true}});S=k;save();hot()}}};
function curQ(){return (tab==="home"||tab==="wrong")&&list.length&&i<list.length?list[i]:null}
function notePanel(){let p=document.getElementById("np");if(!p){p=document.createElement("div");p.id="np";p.style.cssText="position:fixed;left:0;right:0;bottom:0;max-height:75%;overflow:auto;background:var(--sf);border-top:1px solid var(--bd);box-shadow:0 -4px 16px rgba(0,0,0,.25);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:none";document.body.appendChild(p)}return p}
function renderNotes(){const p=notePanel(),q=curQ();
 p.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b>隨手一寫</b><button class="btn" id="nc" style="padding:2px 10px">關閉</button></div><textarea id="ntx" rows="3" placeholder="想到什麼就寫…" style="width:100%;margin-top:8px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px"></textarea>'+(q?'<label style="font-size:13px"><input type="checkbox" id="nq" checked> 附上目前題目('+q[0]+' 第'+q[1]+'題)</label>':'')+'<div style="margin-top:6px"><button class="btn p" id="ns">儲存</button></div><div id="nl">'+NOTES.slice().reverse().map(n=>'<div class="hb"><small>'+esc(n.d)+(n.q?'・'+esc(n.q):'')+'</small><div class="pt">'+esc(n.t).replace(/\n/g,'<br>')+'</div><button class="btn nd" data-i="'+n.i+'" style="padding:1px 8px;font-size:12px;margin-top:4px">刪除</button></div>').join('')+'</div>';
 $("#nc").onclick=()=>{p.style.display="none"};
 $("#ns").onclick=()=>{const t=$("#ntx").value.trim();if(!t)return;const dt=new Date(),nq=$("#nq");NOTES.push({i:Date.now(),d:dt.getFullYear()+"/"+(dt.getMonth()+1)+"/"+dt.getDate()+" "+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0"),t:t,q:(q&&nq&&nq.checked)?q[0]+" 第"+q[1]+"題":""});saveNotes();renderNotes()};
 p.querySelectorAll(".nd").forEach(b=>b.onclick=()=>{NOTES=NOTES.filter(n=>String(n.i)!==b.dataset.i);saveNotes();renderNotes()});
}
const fb=document.createElement("button");fb.textContent="✎";fb.title="隨手一寫";fb.style.cssText="position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:24px;border:0;background:var(--ac);color:#fff;font-size:22px;z-index:25;box-shadow:0 2px 8px rgba(0,0,0,.3)";
fb.onclick=()=>{const p=notePanel();if(p.style.display==="block"){p.style.display="none"}else{renderNotes();p.style.display="block"}};
document.body.appendChild(fb);document.querySelector(".w").style.paddingBottom="90px";
render();
</script></body></html>
